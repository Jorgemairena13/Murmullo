version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: murmullo-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=murmullo
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-}
      - REDIS_HOST=redis
      - MEMCACHED_HOST=memcached
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - murmullo-network

  mysql:
    image: mysql:8.0
    container_name: murmullo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_DATABASE: murmullo
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - murmullo-network

  redis:
    image: redis:7-alpine
    container_name: murmullo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - murmullo-network

  memcached:
    image: memcached:1-alpine
    container_name: murmullo-memcached
    restart: unless-stopped
    ports:
      - "11211:11211"
    networks:
      - murmullo-network

networks:
  murmullo-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data: